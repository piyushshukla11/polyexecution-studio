server.address=127.0.0.1
server.port=8080
spring.main.banner-mode=off

gateway.worker-grpc-target=127.0.0.1:50051
gateway.max-rooms=100
gateway.max-sessions-per-room=20
gateway.max-global-concurrent-runs=16
gateway.rate-limit-runs-per-minute=30
gateway.max-message-bytes=524288
gateway.max-source-bytes=262144
gateway.max-stdin-bytes=65536
